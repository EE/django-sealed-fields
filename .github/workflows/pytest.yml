name: Test with pytest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        include:
          # The oldest versions pyproject.toml allows.
          - python-version: '3.10'
            packages: django==4.2.* cryptography==37.0.0
          - python-version: '3.13'
            packages: django==5.2.*
          - python-version: '3.14'
            packages: django
          - python-version: '3.14'
            packages: django
            database: sqlite

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgrespass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1

      - run: poetry install --sync

      - run: poetry run -- pip install --upgrade --upgrade-strategy eager -- ${{ matrix.packages }}

      - name: Run pytest
        run: poetry run pytest -W error
        env:
          TEST_DATABASE: ${{ matrix.database }}
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespass

      - name: flake8
        run: poetry run flake8
